<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHNICAL WATER - ระบบจัดการข้อมูลเครื่องปรับอากาศสำหรับช่าง</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css">
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <!-- Google Fonts: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e293b',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-800">

  <!-- Top Navbar -->
  <header class="bg-brand-900 text-white flex-none z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo and Title -->
        <a href="/" class="flex items-center gap-3 hover:opacity-90">
          <div class="w-10 h-10 bg-white rounded-lg p-0.5 shadow flex items-center justify-center overflow-hidden">
            <img src="/static/assets/logo.png" alt="TECHNICAL WATER Logo" class="w-full h-full object-contain" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%230284c7%22 stroke-width=%222.5%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>'">
          </div>
          <div>
            <h1 class="text-sm font-bold tracking-tight text-white uppercase leading-none">Technical Water</h1>
            <p class="text-[10px] text-slate-300 mt-1">ระบบจัดการเครื่องปรับอากาศสำหรับช่าง</p>
          </div>
        </a>

        <!-- Navigation Tabs -->
        <nav class="hidden md:flex space-x-2">
          <a href="/" class="px-4 py-2 rounded-md text-sm font-medium transition {% if active_tab == 'dashboard' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %} flex items-center gap-2">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i> แดชบอร์ด
          </a>
          <a href="/locations" class="px-4 py-2 rounded-md text-sm font-medium transition {% if active_tab == 'locations' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %} flex items-center gap-2">
            <i data-lucide="map" class="w-4 h-4"></i> สถานที่
          </a>
          <a href="/acs" class="px-4 py-2 rounded-md text-sm font-medium transition {% if active_tab == 'acs' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %} flex items-center gap-2">
            <i data-lucide="list" class="w-4 h-4"></i> รายการเครื่องปรับอากาศ
          </a>
        </nav>

        <!-- Demo / Server Mode -->
        <div class="flex items-center gap-3">
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/30 flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Cloud DB Mode
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Bottom Nav -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-brand-900 border-t border-slate-800 text-white flex justify-around py-2 z-30 shadow-lg">
    <a href="/" class="flex flex-col items-center gap-0.5 text-xs {% if active_tab == 'dashboard' %}text-white{% else %}text-slate-400 hover:text-white{% endif %} py-1">
      <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      <span>แดชบอร์ด</span>
    </a>
    <a href="/locations" class="flex flex-col items-center gap-0.5 text-xs {% if active_tab == 'locations' %}text-white{% else %}text-slate-400 hover:text-white{% endif %} py-1">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span>สถานที่</span>
    </a>
    <a href="/acs" class="flex flex-col items-center gap-0.5 text-xs {% if active_tab == 'acs' %}text-white{% else %}text-slate-400 hover:text-white{% endif %} py-1">
      <i data-lucide="list" class="w-5 h-5"></i>
      <span>รายการแอร์</span>
    </a>
  </div>

  <!-- Breadcrumbs Bar -->
  <section class="bg-white border-b border-slate-200 py-2.5 px-4 sm:px-6 lg:px-8 flex-none z-10">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-sm flex-wrap gap-2">
      <div class="flex items-center space-x-2 text-slate-500 overflow-x-auto whitespace-nowrap">
        <a href="/" class="hover:text-brand-500 flex items-center gap-1">
          <i data-lucide="home" class="w-4 h-4"></i> หน้าแรก
        </a>
        {% block breadcrumbs %}{% endblock %}
      </div>
      <div class="hidden sm:flex items-center gap-2 text-xs text-slate-500">
        <span class="flex items-center gap-1 text-emerald-500">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ช่างออนไลน์: ช่างสมชาย มั่นคง
        </span>
      </div>
    </div>
  </section>

  <!-- Main View Container -->
  <main class="flex-1 overflow-y-auto pb-16 md:pb-0">
    {% block content %}{% endblock %}
  </main>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();
    
    // Auto-migration script from IndexedDB to Server Database
    async function checkAndMigrateFromIndexedDB() {
      try {
        const dbRequest = indexedDB.open('ACManagementDB', 1);
        dbRequest.onsuccess = function(event) {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('store')) return;
          
          const transaction = db.transaction(['store'], 'readonly');
          const store = transaction.objectStore('store');
          const getRequest = store.get('app_state_data');
          
          getRequest.onsuccess = async function() {
            const localData = getRequest.result;
            if (!localData || !localData.locations || localData.locations.length === 0) return;
            
            try {
              console.log('Migrating local database data to Cloud Server...');
              const syncRes = await fetch('/api/v1/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  locations: localData.locations,
                  acs: localData.acs || []
                })
              });
              
              if (syncRes.ok) {
                console.log('IndexedDB data migrated successfully! Refreshing page...');
                // Clear local IndexedDB to avoid double migrates
                db.close();
                const deleteRequest = indexedDB.open('ACManagementDB', 1);
                deleteRequest.onsuccess = function(ev) {
                  const localDb = ev.target.result;
                  const clearTx = localDb.transaction(['store'], 'readwrite');
                  clearTx.objectStore('store').delete('app_state_data');
                  window.location.reload();
                };
              }
            } catch (e) {
              console.error('Migration failed:', e);
            }
          };
        };
      } catch (err) {
        console.warn("IndexedDB not supported or blocked, skipping migration check");
      }
    }
    
    // Run migration check on startup
    window.addEventListener('DOMContentLoaded', () => {
      checkAndMigrateFromIndexedDB();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
