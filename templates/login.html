<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - TECHNICAL WATER</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center">
  <!-- Dark Overlay to darkened the image background -->
  <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-[6px] z-0"></div>

  <div class="relative max-w-md w-full mx-4 bg-white/85 backdrop-blur-2xl border border-white/30 p-8 sm:p-10 rounded-[32px] shadow-2xl z-10">
    <!-- Header/Logo Section -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <img class="h-14 w-14 object-contain bg-white/10 rounded-lg p-1" src="/static/assets/logo.png" alt="TECHNICAL WATER Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232563eb%22 stroke-width=%222.5%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>'">
      <div class="text-left leading-none">
        <div class="text-lg font-black text-slate-800 tracking-wider">TECHNICAL WATER</div>
        <div class="text-[10px] text-slate-700 font-bold uppercase tracking-widest mt-1">Engineering & Facility</div>
      </div>
    </div>

    <div class="text-center mb-6">
      <h2 class="text-lg font-black text-slate-900 leading-snug">
        เข้าสู่ระบบจัดการเครื่องปรับอากาศสำหรับช่าง
      </h2>
      <p class="text-xs text-slate-700 mt-1.5">
        กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน
      </p>
    </div>
    
    {% if error %}
    <div class="bg-red-500/10 border border-red-500/20 text-red-100 px-4 py-3 rounded-xl text-sm mb-6 text-center" role="alert">
      <span class="block sm:inline">{{ error }}</span>
    </div>
    {% endif %}

    <form class="space-y-5" action="/login" method="POST">
      <div class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-bold text-slate-800 mb-1">ชื่อผู้ใช้งาน (Username)</label>
          <input id="username" name="username" type="text" required class="appearance-none rounded-xl block w-full px-4 py-2.5 bg-white border-0 shadow-inner text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="ระบุชื่อผู้ใช้งาน">
        </div>
        <div>
          <label for="password" class="block text-xs font-bold text-slate-800 mb-1">รหัสผ่าน (Password)</label>
          <div class="relative flex items-center">
            <input id="password" name="password" type="password" required class="appearance-none rounded-xl block w-full pl-4 pr-10 py-2.5 bg-white border-0 shadow-inner text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="กรอกรหัสผ่าน">
            <button type="button" onclick="togglePasswordVisibility('password', 'eye-icon-login')" class="absolute right-3 text-slate-400 hover:text-slate-600 focus:outline-none">
              <i id="eye-icon-login" data-lucide="eye" class="w-4.5 h-4.5"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-3 bg-[#1d4ed8] hover:bg-blue-700 text-white rounded-xl font-bold transition duration-150 ease-in-out shadow-lg text-sm tracking-wider">
          เข้าสู่ระบบ
        </button>
      </div>
    </form>
  </div>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toggle password visibility
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === "password") {
        input.type = "text";
        icon.setAttribute("data-lucide", "eye-off");
      } else {
        input.type = "password";
        icon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
